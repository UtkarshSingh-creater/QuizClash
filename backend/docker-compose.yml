version: '3.9'

services:

  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - '8000:8000'
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: quizdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  redis:
    image: redis:7

  celery:
    build: .
    command: celery -A core worker -l info
    depends_on:
      - redis

  celery-beat:
    build: .
    command: celery -A core beat -l info
    depends_on:
      - redis